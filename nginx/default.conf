upstream shell_upstream {
    server shell:5173;
}

upstream gateway_upstream {
    server api-gateway:3000;
}

upstream mfe_entrenamiento_upstream {
    server mfe-entrenamiento:9102;
}

upstream mfe_gimnasio_upstream {
    server mfe-gimnasio:9105;
}

upstream mfe_inventario_upstream {
    server mfe-inventario:9104;
}

server {
    listen 80;
    server_name localhost;

    # Encabezados de seguridad para Service Worker y PWA
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 1. API Gateway NestJS
    location /api/ {
        proxy_pass http://gateway_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Microfrontend Entrenamiento (Angular)
    location /mfe/entrenamiento/ {
        proxy_pass http://mfe_entrenamiento_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Microfrontend Gimnasio (Angular)
    location /mfe/gimnasio/ {
        proxy_pass http://mfe_gimnasio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Microfrontend Inventario (Angular)
    location /mfe/inventario/ {
        proxy_pass http://mfe_inventario_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Service Worker y Manifest PWA (sin caché para actualización inmediata)
    location ~* (sw\.js|manifest\.webmanifest)$ {
        proxy_pass http://shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/" always;
    }

    # 6. Shell Host (React Vite Single-SPA)
    location / {
        proxy_pass http://shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

