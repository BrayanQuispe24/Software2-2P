upstream shell_upstream {
    server shell:5173;
}

upstream gateway_upstream {
    server api-gateway:3000;
}

upstream auth_upstream {
    server ms-auth:4000;
}

upstream mfe_entrenamiento_upstream {
    server mfe-entrenamiento:9102;
}

upstream mfe_gimnasio_upstream {
    server mfe-gimnasio:9105;
}

upstream mfe_inventario_upstream {
    server mfe-inventario:9104;
}

upstream mcp_upstream {
    server ms-mcp:8090;
}

server {
    listen 80;
    server_name localhost;

    # Encabezados de seguridad para Service Worker y PWA
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 1. API Gateway NestJS (Rutas /api/ y /auth/)
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Servidor OIDC de Autenticación Centralizada (ms-auth)
    location /oidc/ {
        proxy_pass http://auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2b. Protocolo MCP (Streamable HTTP y SSE) para Claude / ChatGPT / Clientes MCP
    location /mcp {
        proxy_pass http://mcp_upstream/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /sse {
        proxy_pass http://mcp_upstream/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /messages {
        proxy_pass http://mcp_upstream/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /interaction/ {
        proxy_pass http://auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Microfrontend Entrenamiento (Angular)
    location /mfe/entrenamiento/ {
        proxy_pass http://mfe_entrenamiento_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Microfrontend Gimnasio (Angular)
    location /mfe/gimnasio/ {
        proxy_pass http://mfe_gimnasio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Microfrontend Inventario (Angular)
    location /mfe/inventario/ {
        proxy_pass http://mfe_inventario_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 6. Service Worker y Manifest PWA (sin caché para actualización inmediata)
    location ~* (sw\.js|manifest\.webmanifest)$ {
        proxy_pass http://shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/" always;
    }

    # 7. Shell Host (React Vite Single-SPA)
    location / {
        proxy_pass http://shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
