services:
  postgres:
    image: postgres:17
    container_name: ms-gimnasio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_dev_password
      POSTGRES_DB: ms_gimnasio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_gimnasio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d ms_gimnasio_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ms-gimnasio-net

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ms-gimnasio-dynamodb
    user: root
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - dynamodb_gimnasio_data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    networks:
      - ms-gimnasio-net

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: ms-gimnasio-dynamodb-admin
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    depends_on:
      - dynamodb-local
    networks:
      - ms-gimnasio-net

  ms-gimnasio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-gimnasio-app
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ms_gimnasio_db
      SPRING_DATASOURCE_USERNAME: gym_user
      SPRING_DATASOURCE_PASSWORD: gym_dev_password
      JWT_SECRET: ${JWT_SECRET:-SUPER_SECRET_KEY_FOR_DEV_JWT_APEX_FITNESS_SSO_2026}
      GYM_QR_SECRET: ${GYM_QR_SECRET:-ApexFitnessGymSecureQrHmacKey2026!}
      AWS_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_TABLE_ACCESOS: apex_registro_accesos
      GYM_ACCESS_STORAGE_DRIVER: ${GYM_ACCESS_STORAGE_DRIVER:-dynamodb}
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
    networks:
      - ms-gimnasio-net

volumes:
  postgres_gimnasio_data:
  dynamodb_gimnasio_data:

networks:
  ms-gimnasio-net:
    driver: bridge
