server:
  port: 8082

spring:
  application:
    name: ms-gimnasio

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ms_gimnasio_db
    username: postgres
    password: ${DB_PASSWORD:6305913}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    cors:
      allowed-origins: "http://localhost:5173,http://localhost:3000,http://localhost:9104,http://localhost:9105,http://127.0.0.1:9105"
      allowed-methods: "GET,POST,OPTIONS"
      allowed-headers: "*"

jwt:
  secret: ${JWT_SECRET:SUPER_SECRET_KEY_FOR_DEV_JWT_APEX_FITNESS_SSO_2026}

gym:
  security:
    qr-secret: ${GYM_QR_SECRET:ApexFitnessGymSecureQrHmacKey2026!}
    anti-passback-minutes: 10
