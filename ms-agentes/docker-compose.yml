version: '3.8'

services:
  db-agentes:
    image: postgres:17-alpine
    container_name: local-db-agentes
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentes_user
      POSTGRES_PASSWORD: agentes_dev_password
      POSTGRES_DB: ms_agentes_db
    ports:
      - "5436:5432"
    volumes:
      - data-agentes-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentes_user -d ms_agentes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-agentes:
    build: .
    container_name: local-ms-agentes
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgresql://agentes_user:agentes_dev_password@db-agentes:5432/ms_agentes_db
      PORT: 8085
      INTERNAL_API_TOKEN: ${AGENTES_INTERNAL_TOKEN:-af_internal_agentes_token_2026}
      GYM_SERVICE_URL: http://34.69.21.179:8082
      INVENTARIO_SERVICE_URL: http://34.69.21.179:8084
      ENTRENAMIENTO_SERVICE_URL: http://34.69.21.179:8083
      MCP_SERVICE_URL: ${MCP_SERVICE_URL:-http://host.docker.internal:8090}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://host.docker.internal:8000}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://host.docker.internal:5678/webhook/agente-alerta}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-agentes:
        condition: service_healthy

volumes:
  data-agentes-local:

