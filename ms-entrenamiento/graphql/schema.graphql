type Mutation {
  crearEjercicio(input: CrearEjercicioInput!): Ejercicio!
    @field(resolver: "App\\GraphQL\\Mutations\\CrearEjercicioMutation")

  crearRutina(input: CrearRutinaInput!): Rutina!
    @field(resolver: "App\\GraphQL\\Mutations\\CrearRutinaMutation")

  # Rutinas Personalizadas NoSQL (MongoDB)
  guardarRutinaPersonalizada(input: GuardarRutinaPersonalizadaInput!): RutinaPersonalizada!
    @field(resolver: "App\\GraphQL\\Mutations\\GuardarRutinaPersonalizadaMutation")

  eliminarRutinaPersonalizada(id: ID!): Boolean!
    @field(resolver: "App\\GraphQL\\Mutations\\EliminarRutinaPersonalizadaMutation")

  asignarPlanEntrenamiento(input: AsignarPlanEntrenamientoInput!): PlanEntrenamiento!
