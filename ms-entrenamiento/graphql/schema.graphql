"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"A date string with format `Y-m-d`, e.g. `2011-05-23`."
scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

# ----------------------------------------------------
# Tipos de Dominio
# ----------------------------------------------------

type TipoEjercicio {
  id: ID!
  nombre: String!
  descripcion: String
  estado: String!
  ejercicios: [Ejercicio!]! @hasMany(relation: "ejercicios")
}

type GrupoMuscular {
  id: ID!
  nombre: String!
  descripcion: String
}

type EjercicioGrupoMuscular {
  id: ID!
  tipoParticipacion: String! @rename(attribute: "tipo_participacion")
  observacion: String
  grupoMuscular: GrupoMuscular! @belongsTo(relation: "grupoMuscular")
}

type Ejercicio {
  id: ID!
  externalId: String @rename(attribute: "external_id")
  nombre: String!
  descripcion: String
  urlVideo: String @rename(attribute: "url_video")
  imagenes: [String!]
  fuerza: String
  equipamiento: String
  nivelDificultad: String! @rename(attribute: "nivel_dificultad")
  mecanica: String
  patronMovimiento: String @rename(attribute: "patron_movimiento")
  tipoEjercicio: TipoEjercicio! @belongsTo(relation: "tipoEjercicio")
  gruposMusculares: [EjercicioGrupoMuscular!]! @hasMany(relation: "gruposMusculares")
}

type RutinaEjercicio {
  id: ID!
  series: Int!
  repeticiones: Int!
  peso: Float
  duracionSegundos: Int @rename(attribute: "duracion_segundos")
  descansoSegundos: Int @rename(attribute: "descanso_segundos")
  orden: Int!
  observacion: String
  ejercicio: Ejercicio! @belongsTo(relation: "ejercicio")
}

type Rutina {
  id: ID!
  nombre: String!
  descripcion: String
  nivel: String!
  estado: Boolean!
  rutinaEjercicios: [RutinaEjercicio!]! @hasMany(relation: "rutinaEjercicios")
}

# ----------------------------------------------------
# Rutinas Personalizadas NoSQL (MongoDB)
# ----------------------------------------------------

type SerieDetalle {
  set: Int!
  repeticiones: Int
  pesoKg: Float
  rpeObjetivo: Float
  duracionSegundos: Int
  descansoSegundos: Int
  nota: String
}

type EjercicioBloqueItem {
  ejercicioId: ID
  nombre: String!
  series: Int
  repeticiones: Int
  pesoKg: Float
  duracionSegundos: Int
  descansoSegundos: Int
  notaTecnica: String
  seriesDetalle: [SerieDetalle!]
}

type BloqueEntrenamiento {
  orden: Int!
  nombre: String
  tipoBloque: String!
  metodo: String
  protocolo: String
  rondas: Int
  intervaloTrabajoSeg: Int
  intervaloDescansoSeg: Int
  ejercicios: [EjercicioBloqueItem!]!
}

type RutinaPersonalizada {
  id: ID!
  usuarioId: ID!
  nombre: String!
  descripcion: String
  objetivo: String!
  tipoEntrenamiento: String!
  nivel: String!
  estado: String!
  duracionEstimadaMinutos: Int
  bloques: [BloqueEntrenamiento!]!
  createdAt: DateTime
  updatedAt: DateTime
}

type PlanEntrenamientoRutina {
  id: ID!
  diaSemana: String! @rename(attribute: "dia_semana")
  rutina: Rutina! @belongsTo(relation: "rutina")
}

type PlanEntrenamiento {
  id: ID!
  idUsuario: ID! @rename(attribute: "id_usuario")
  nombre: String!
  objetivo: String!
  fechaInicio: Date! @rename(attribute: "fecha_inicio")
  fechaFin: Date! @rename(attribute: "fecha_fin")
  estado: Boolean!
  observacion: String
  rutinasProgramadas: [PlanEntrenamientoRutina!]! @hasMany(relation: "rutinasProgramadas")
}

type DetallePlanAlimentacion {
  id: ID!
  diaSemana: String! @rename(attribute: "dia_semana")
  tipoComida: String! @rename(attribute: "tipo_comida")
  alimento: String!
  cantidad: Float!
  unidad: String!
  hora: String
  calorias: Float
  proteinas: Float
  carbohidratos: Float
  grasas: Float
  observacion: String
}

type PlanAlimentacion {
  id: ID!
  idUsuario: ID! @rename(attribute: "id_usuario")
  nombre: String!
  objetivo: String!
  fechaInicio: Date! @rename(attribute: "fecha_inicio")
  fechaFin: Date! @rename(attribute: "fecha_fin")
  observacion: String
  estado: Boolean!
  comidas: [DetallePlanAlimentacion!]! @hasMany(relation: "comidas")
}

type DetalleHistorial {
  id: ID!
  peso: Float!
  altura: Float!
  imc: Float!
  porcentajeGasa: Float @rename(attribute: "porcentaje_grasa")
  masaMuscular: Float @rename(attribute: "masa_muscular")
  presion: String
  fechaRegistro: DateTime! @rename(attribute: "fecha_registro")
}

type Historial {
  id: ID!
  idUsuario: ID! @rename(attribute: "id_usuario")
  fechaApertura: Date! @rename(attribute: "fecha_apertura")
  observacionesGenerales: String @rename(attribute: "observaciones_generales")
  grupoSanguineo: String @rename(attribute: "grupo_sanguineo")
  sexo: String
  fechaNacimiento: Date @rename(attribute: "fecha_nacimiento")
  domicilio: String
  facultadCarrera: String @rename(attribute: "facultad_carrera")
  celularEmergencia: String @rename(attribute: "celular_emergencia")
  detalles: [DetalleHistorial!]! @hasMany(relation: "detalles")
}

# ----------------------------------------------------
# Queries
# ----------------------------------------------------

type Query {
  # Catálogos
  tiposEjercicio: [TipoEjercicio!]! @all
  gruposMusculares: [GrupoMuscular!]! @all

  # Ejercicios
  ejercicios(
    tipoEjercicioId: ID @where(key: "id_tipo_ejercicio")
    nivelDificultad: String @where(key: "nivel_dificultad")
  ): [Ejercicio!]! @all
  ejercicioPorId(id: ID! @eq): Ejercicio @find

  # Rutinas Relacionales (Legadas)
  rutinas(
    nivel: String @where
    estado: Boolean @where
  ): [Rutina!]! @all
  rutinaPorId(id: ID! @eq): Rutina @find

  # Rutinas Personalizadas NoSQL (MongoDB)
  rutinasPersonalizadasPorUsuario(
    usuarioId: ID!
  ): [RutinaPersonalizada!]! @field(resolver: "App\\GraphQL\\Queries\\RutinasPersonalizadasPorUsuarioQuery")

  rutinaPersonalizadaPorId(
    id: ID!
  ): RutinaPersonalizada @field(resolver: "App\\GraphQL\\Queries\\RutinaPersonalizadaPorIdQuery")

  # Planes de Entrenamiento
  planesEntrenamiento(
    usuarioId: ID @where(key: "id_usuario")
    estado: Boolean @where
  ): [PlanEntrenamiento!]! @all

  planEntrenamientoActivo(
    usuarioId: ID!
  ): PlanEntrenamiento @field(resolver: "App\\GraphQL\\Queries\\PlanEntrenamientoActivoQuery")

  # Nutrición
  planesAlimentacion(
    usuarioId: ID @where(key: "id_usuario")
    estado: Boolean @where
  ): [PlanAlimentacion!]! @all

  planAlimentacionActivo(
    usuarioId: ID!
  ): PlanAlimentacion @field(resolver: "App\\GraphQL\\Queries\\PlanAlimentacionActivoQuery")

  # Historial Clínico y Antropometría
  historialPorUsuario(
    usuarioId: ID!
  ): Historial @field(resolver: "App\\GraphQL\\Queries\\HistorialPorUsuarioQuery")

  historiales: [Historial!]! @all
}

